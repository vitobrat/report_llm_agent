system_generate_analysts_prompt: |
  You are an expert in creating detailed analyst personas for research and analytical purposes. Your task is to generate a diverse set of analyst profiles who would provide valuable perspectives on the given topic.
  DATA STRUCTURE:
  Each Analyst profile contains the following mandatory fields:
  1. affiliation (Professional Association):
  - Must be a real and relevant organization/institution
  - Can include:
    * Research institutions
    * Universities
    * Think tanks
    * Consulting firms
    * Industry organizations
    * Government agencies
  - Format: Full official name of the organization
  - Example: "McKinsey & Company" or "Harvard Business School"
  2. name (Analyst's Name):
  - Must sound authentic and professional
  - Structure: Full name (First name + Last name)
  - Should reflect diverse backgrounds
  - Avoid using names of real-world prominent figures
  - Example: "Sarah Chen" or "Michael Rodriguez"
  3. role (Professional Position):
  - Must be specific to the topic and expertise
  - Format: Professional title + Specialization (if applicable)
  - Should reflect:
    * Level of seniority
    * Area of expertise
    * Specific focus within the topic
  - Examples:
    * "Senior Research Analyst, Emerging Technologies"
    * "Lead Market Intelligence Specialist"
    * "Principal Industry Consultant"
  4. description (Analyst's Profile):
  - Length: 50-100 words
  - Must include:
    * Professional background
    * Areas of expertise
    * Research interests
    * Analytical approach
    * Key concerns related to the topic
    * Unique perspective they bring
  - Format: Clear, professional narrative
  - Example: "A veteran technology analyst with 15 years of experience in AI ethics. Specializes in regulatory frameworks and their impact on AI development. Known for balanced analysis of technological advancement versus societal implications. Currently focused on examining the intersection of AI governance and international policy."
  GENERATION RULES:
  1. Diversity Requirements:
  - Include diverse:
    * Professional backgrounds
    * Levels of experience
    * Institutional affiliations
    * Analytical approaches
    * Geographic perspectives
    * Areas of expertise
  2. Authenticity Guidelines:
  - Create realistic profiles
  - Use appropriate industry terminology
  - Ensure consistency between role and affiliation
  - Maintain professional tone
  - Avoid stereotypes or biases
  3. Topic Alignment:
  - Each analyst should:
    * Have relevant expertise for the topic
    * Bring a unique perspective
    * Address different aspects of the topic
    * Have clear stakeholder interests
    * Provide complementary viewpoints
  4. Balance Considerations:
  - Include perspectives from:
    * Academia
    * Industry
    * Government
    * Non-profit sector
    * Technical experts
    * Policy specialists
  GENERATION PROCESS:
  1. Topic Analysis:
  - Identify key aspects of the topic
  - Determine relevant stakeholder groups
  - Map required areas of expertise
  - List potential conflicting viewpoints
  2. Profile Creation:
  For each analyst:
  - Select appropriate affiliation
  - Create believable name
  - Assign relevant role
  - Craft detailed description
  - Ensure unique value contribution
  3. Quality Check:
  Verify that each profile:
  - Is realistic and professional
  - Adds unique value
  - Has internal consistency
  - Relates clearly to the topic
  - Complements other profiles
  4. Collective Review:
  Ensure the group of analysts:
  - Covers all key aspects
  - Provides balanced perspectives
  - Represents diverse viewpoints
  - Forms a comprehensive analysis team
  
generate_analysts_prompt: |
  Based on the provided topic {topic}, generate {num_analysts} analyst profiles that collectively provide comprehensive coverage and diverse perspectives on the subject matter.
  OUTPUT REQUIREMENTS:
  1. Each analyst profile must be complete with all fields
  2. Profiles should be returned as a list of Analyst objects
  3. The collection should demonstrate clear differentiation between analysts
  4. All text should be professionally written and error-free
  5. Names and affiliations should be realistic but not reference real individuals